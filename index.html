<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReadStar - Learn to Read</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>
    <div id="app">
        <section id="intro-screen" aria-label="Home screen">
            <h1 id="intro-title">ReadStar</h1>
            <p>Choose a game</p>
            <div id="game-menu">
                <button id="btn-open-readstar" class="menu-btn">ReadStar</button>
                <button id="btn-open-letter-crunch" class="menu-btn">Letter Crunch</button>
            </div>
        </section>

        <div id="main-app" class="hidden">
            <header>
                <div id="prefix-display" class="empty"></div>
            </header>

            <div id="controls">
                <button id="btn-back" class="control-btn" aria-label="Back">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 12H5M12 19l-7-7 7-7" />
                    </svg>
                </button>
                <button id="btn-clear" class="control-btn" aria-label="Clear">
                    <!-- Eraser Icon -->
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M7 21L21 7l-5-5L3 16 7 21z M5 14l9 9" />
                    </svg>
                </button>
                <button id="btn-settings" class="control-btn" aria-label="Settings">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path
                            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" />
                    </svg>
                </button>
            </div>

            <div id="action-area">
                <button id="btn-read" class="action-btn hidden" aria-label="Read this word">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z" />
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
                        <line x1="12" y1="19" x2="12" y2="23" />
                        <line x1="8" y1="23" x2="16" y2="23" />
                    </svg>
                </button>
            </div>

            <main>
                <div id="letter-grid">
                    <!-- Letters will be injected here -->
                </div>
            </main>
        </div>

        <section id="letter-crunch-app" class="hidden" aria-label="Letter Crunch game">
            <div class="letter-crunch-header">
                <button id="btn-letter-crunch-home" class="control-btn" aria-label="Back to Home">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 12H5M12 19l-7-7 7-7" />
                    </svg>
                </button>
                <h2>Letter Crunch</h2>
                <button id="btn-letter-crunch-reset" class="control-btn" aria-label="Reset Scores">↻</button>
            </div>

            <div class="letter-crunch-scoreboard">
                <div id="player1-score" class="score-card active">Player 1: 0</div>
                <div id="player2-score" class="score-card">Player 2: 0</div>
            </div>

            <div class="letter-crunch-stage">
                <div id="left-crocodile" class="crocodile left">🐊</div>
                <div id="letter-crunch-letter" aria-live="polite">A</div>
                <div id="right-crocodile" class="crocodile right">🐊</div>
            </div>

            <p id="letter-crunch-status">Player 1, hold your side and say the letter.</p>

            <div class="letter-crunch-controls">
                <button id="btn-player1" class="player-btn player1" aria-label="Player 1 hold to speak">Hold to Speak<br>Player 1</button>
                <button id="btn-player2" class="player-btn player2" aria-label="Player 2 hold to speak">Hold to Speak<br>Player 2</button>
            </div>
        </section>

        <!-- Settings Modal -->
        <div id="settings-modal" class="modal hidden">
            <div class="modal-content">
                <h2>Settings</h2>

                <div class="setting-group">
                    <label for="word-list-input">Word List (one per line)</label>
                    <textarea id="word-list-input" rows="10"></textarea>
                    <button id="btn-save-words" class="primary-btn">Save Words</button>
                </div>

                <div class="setting-group">
                    <h3>Completed Words</h3>
                    <div id="completed-log" class="log-container"></div>
                    <button id="btn-clear-log" class="secondary-btn">Clear Log</button>
                </div>

                <div class="setting-group">
                    <h3>Options</h3>
                    <label class="toggle">
                        <input type="checkbox" id="toggle-sounds" checked>
                        <span>Letter Sounds</span>
                    </label>
                    <label class="toggle">
                        <input type="checkbox" id="toggle-speech-prompts" checked>
                        <span>Speech Prompts</span>
                    </label>
                    <label class="toggle">
                        <input type="checkbox" id="toggle-letter-filter" checked>
                        <span>Guide Letters (only show valid next letters)</span>
                    </label>
                </div>

                <button id="btn-close-settings" class="close-btn">Close</button>
            </div>
        </div>

        <!-- Confetti Canvas -->
        <canvas id="confetti-canvas"></canvas>
    </div>

    <script src="app.js" type="module"></script>
</body>

</html>
